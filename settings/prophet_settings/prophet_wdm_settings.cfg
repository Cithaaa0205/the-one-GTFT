[ Scenario ]
Scenario.name = WDM_MultiBus_ProphetSubOptimal_2h
Scenario.simulateConnections = true
Scenario.updateInterval = 0.1
Scenario.endTime = 10000

[ Interface Settings ]
# Interface 1: Bluetooth (Manusia)
btInterface.type = SimpleBroadcastInterface
btInterface.transmitSpeed = 250k
btInterface.transmitRange = 100

# Interface 2: High Speed Wifi (Bus/Tram)
tramInterface.type = SimpleBroadcastInterface
tramInterface.transmitSpeed = 10M
tramInterface.transmitRange = 300

[ Global Group Settings ]
Scenario.nrofHostGroups = 12

# Router Default
Group.router = ProphetRouterOld2
Group.bufferSize = 1000M
# Group.msgTtl = 720

Group.nrOfOffices = 50
Group.nrOfMeetingSpots = 10

# Ukuran gedung kantor (150 meter x 150 meter)
Group.officeSize = 150

# Koefisien seberapa lama orang diam di meja sebelum jalan lagi (di dalam kantor)
Group.officeWaitTimeParetoCoeff = 0.5
Group.officeMinWaitTime = 10
Group.officeMaxWaitTime = 1000

# Ukuran probabilitas variasi waktu (agar tidak robotik)
Group.timeDiffSTD = 7200
Group.minGroupSize = 1
Group.maxGroupSize = 3
Group.minAfterShoppingStopTime = 3600
Group.maxAfterShoppingStopTime = 7200

[ Working Day Movement Global Settings ]
MovementModel.worldSize = 10000, 8000

MapBasedMovement.nrofMapFiles = 1
MapBasedMovement.mapFile1 = data/spatial/HelsinkiMedium/roads.wkt

# WorkingDayMovement.probabilityToOwnCar = 0
# WorkingDayMovement.probabilityToShop = 0.5
WorkingDayMovement.officeWaitTime = 7h, 9h
WorkingDayMovement.homeWaitTime = 8h, 12h
WorkingDayMovement.shopWaitTime = 10m, 60m

# Lokasi Global Default
WorkingDayMovement.nrofOfficeMapFiles = 1
WorkingDayMovement.officeMapFile1 = data/spatial/HelsinkiMedium/A_offices.wkt
WorkingDayMovement.nrofHomeMapFiles = 1
WorkingDayMovement.homeMapFile1 = data/spatial/HelsinkiMedium/A_homes.wkt
WorkingDayMovement.nrofMeetingSpotMapFiles = 1
WorkingDayMovement.meetingSpotMapFile1 = data/spatial/HelsinkiMedium/A_meetingspots.wkt

