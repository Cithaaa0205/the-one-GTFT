## Override: trace manusia Reality MIT, satu minggu (minggu ke-7).
## Trace punya 96 ID berbeda dalam rentang 0-96 (ID 24 tidak pernah muncul), jadi
## nrofHosts = 97 agar ID 96 ada. Di minggu ke-7 hanya 86 node yang aktif; versi
## dengan node aktif saja: trace_reality_aktif.cfg.
## Buat file trace dulu:  python toolkit/tft/cut_reality.py 7 1 > data/events/Reality_w7.txt
## Letakkan setelah tft_common.cfg dan file baseline/hubaware.
## Parameter trafik, interval, dan TTL sama dengan trace_haggle.cfg agar dua
## trace manusia bisa dibandingkan; yang berbeda hanya trace dan jumlah node.
Scenario.endTime = 604800
Scenario.nrofHostGroups = 1
Group1.groupID = N
Group1.nrofHosts = 97
Group.msgTtl = 1440
Events1.filePath = data/events/Reality_w7.txt
Events2.interval = 60, 120
Events2.size = 20k
Events2.hosts = 0, 97
TftControlPlane.interval = 3600
TftControlPlane.degreeWindow = 21600
TftLoadReport.hubFraction = 0.1
# hub untuk evaluasi: derajat (tetangga unik), sama dengan dasar faktor S;
# laporan juga menulis versi berdasarkan jumlah kontak
TftLoadReport.hubRanking = unique
