## =====================================================================
## Mode distributed kini menjadi DEFAULT; file ini tidak wajib lagi dan
## dipertahankan hanya agar perintah lama tetap jalan.
## OVERRIDE: link state per node (tabel sendiri, tukar saat kontak, EWMA).
## Tambahkan di urutan terakhir perintah, misalnya:
##   one.bat -b 3 settings\common\tft_common.cfg settings\baseline\baseline.cfg settings\common\linkstate_distributed.cfg
## Tanpa file ini, mode default adalah "ideal" (snapshot global) sehingga
## hasil acuan lama tetap tereproduksi.
## =====================================================================
TftControlPlane.linkStateMode = distributed
TftControlPlane.ewmaAlpha = 0.8
# ukuran paket (byte), sama dengan Events2.size, untuk kapasitas link (paket/detik)
TftControlPlane.packetSize = 10000
