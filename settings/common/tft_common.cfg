## =====================================================================
## PARAMETER BERSAMA (baseline dan hub-aware). Diubah atas persetujuan berdua.
## Skenario sederhana: 2 hub + 10 perifer, trace kontak sintetis 12 jam.
## =====================================================================

Scenario.simulateConnections = false
Scenario.updateInterval = 1
Scenario.endTime = 43200
Scenario.nrofHostGroups = 2

btInterface.type = SimpleBroadcastInterface
btInterface.transmitSpeed = 250k
btInterface.transmitRange = 10

Group.bufferSize = 5M
Group.msgTtl = 120
Group.nrofInterfaces = 1
Group.interface1 = btInterface
Group.movementModel = StationaryMovement
Group.nodeLocation = 10, 10
Group.speed = 0, 0

# node 0-1 = hub (H), node 2-11 = perifer (P)
Group1.groupID = H
Group1.nrofHosts = 2
Group2.groupID = P
Group2.nrofHosts = 10

## ---------------- control plane bersama ----------------
# panjang interval TFT (detik)
TftControlPlane.interval = 600
# jendela waktu derajat kontak delta (detik)
TftControlPlane.degreeWindow = 3600
# beban relay L: interval = paket relay per interval, buffer = isi buffer
TftControlPlane.loadMetric = interval
# kapasitas relay C (paket per interval bila loadMetric = interval)
TftControlPlane.relayCapacity = 20

## ---------------- parameter source routing (baseline) ----------------
ShevadeTftRouter.epsBase = 2
ShevadeTftRouter.repFactor = 1
ShevadeTftRouter.maxHops = 3
# deadline Chebyshev (detik); -1 = sama dengan TTL
ShevadeTftRouter.deadline = -1
# Fig. 4 dijalankan ulang di awal setiap interval
ShevadeTftRouter.replanEachInterval = true

## ---------------- event ----------------
Events.nrof = 2
Events1.class = ExternalEventsQueue
Events1.filePath = data/events/tft_hub_trace.txt
Events2.class = MessageEventGenerator
Events2.interval = 20, 40
Events2.size = 10k
# pesan antarperifer saja (node 2..11)
Events2.hosts = 2, 12
Events2.prefix = M

MovementModel.rngSeed = 1
MovementModel.worldSize = 100, 100
MovementModel.warmup = 0

## ---------------- laporan ----------------
Report.nrofReports = 1
Report.warmup = 0
Report.reportDir = reports/tft
Report.report1 = TftLoadReport
TftLoadReport.hubFraction = 0.2
